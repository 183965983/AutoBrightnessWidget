name: Build

on:
  push:
    branches: [ dev, main, master, develop ]
  pull_request:
    branches: [ dev, main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up MSVC
      uses: microsoft/setup-msbuild@v2
    
    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.5.0'
        arch: 'win64_msvc2019_64'
        cache: true
    
    - name: Install OpenCV
      run: |
        # Download and extract OpenCV
        $opencvVersion = "4.10.0"
        $opencvUrl = "https://github.com/opencv/opencv/releases/download/${opencvVersion}/opencv-${opencvVersion}-windows.exe"
        $opencvInstaller = "opencv-installer.exe"
        
        Write-Host "Downloading OpenCV ${opencvVersion}..."
        Invoke-WebRequest -Uri $opencvUrl -OutFile $opencvInstaller -UseBasicParsing
        
        Write-Host "Extracting OpenCV..."
        Start-Process -FilePath $opencvInstaller -ArgumentList "-o$env:GITHUB_WORKSPACE\opencv-temp", "-y" -Wait -NoNewWindow
        
        if (-not (Test-Path "$env:GITHUB_WORKSPACE\opencv-temp")) {
            Write-Error "OpenCV extraction failed"
            exit 1
        }
        
        if (Test-Path "$env:GITHUB_WORKSPACE\opencv-temp\opencv") {
            Move-Item "$env:GITHUB_WORKSPACE\opencv-temp\opencv" "$env:GITHUB_WORKSPACE\opencv"
        } else {
            Move-Item "$env:GITHUB_WORKSPACE\opencv-temp" "$env:GITHUB_WORKSPACE\opencv"
        }
        
        if (-not (Test-Path "$env:GITHUB_WORKSPACE\opencv\build")) {
            Write-Error "OpenCV build directory not found after extraction"
            exit 1
        }
        
        echo "OpenCV_DIR=$env:GITHUB_WORKSPACE\opencv\build" >> $env:GITHUB_ENV
        echo "$env:GITHUB_WORKSPACE\opencv\build\x64\vc17\bin" >> $env:GITHUB_PATH
      shell: pwsh
    
    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A x64 -DOpenCV_DIR="$env:OpenCV_DIR" -DBUILD_TESTS=ON
      shell: pwsh
    
    - name: Build
      run: |
        cd build
        cmake --build . --config Release
      shell: pwsh
    
    - name: Prepare artifacts
      run: |
        # Create artifacts directory
        mkdir artifacts
        
        # Copy built executables and DLLs
        Copy-Item build/Release/*.exe artifacts/ -ErrorAction SilentlyContinue
        Copy-Item build/Release/*.dll artifacts/ -ErrorAction SilentlyContinue
        
        # Verify main executable exists
        if (-not (Test-Path "artifacts/AutoBrightnessWidget.exe")) {
            Write-Error "Main executable not found"
            exit 1
        }
        
        Write-Host "Build artifacts prepared successfully"
      shell: pwsh
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: artifacts/*
        if-no-files-found: error
        retention-days: 7
  
  package:
    needs: build
    runs-on: windows-2022
    permissions:
      contents: read
      actions: read
    
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4.1.3
      with:
        name: build-artifacts
        path: build-artifacts
    
    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.5.0'
        arch: 'win64_msvc2019_64'
        cache: true
    
    - name: Install OpenCV
      run: |
        $opencvVersion = "4.10.0"
        $opencvUrl = "https://github.com/opencv/opencv/releases/download/${opencvVersion}/opencv-${opencvVersion}-windows.exe"
        $opencvInstaller = "opencv-installer.exe"
        
        Write-Host "Downloading OpenCV ${opencvVersion}..."
        Invoke-WebRequest -Uri $opencvUrl -OutFile $opencvInstaller -UseBasicParsing
        
        Write-Host "Extracting OpenCV..."
        Start-Process -FilePath $opencvInstaller -ArgumentList "-o$env:GITHUB_WORKSPACE\opencv-temp", "-y" -Wait -NoNewWindow
        
        if (-not (Test-Path "$env:GITHUB_WORKSPACE\opencv-temp")) {
            Write-Error "OpenCV extraction failed"
            exit 1
        }
        
        if (Test-Path "$env:GITHUB_WORKSPACE\opencv-temp\opencv") {
            Move-Item "$env:GITHUB_WORKSPACE\opencv-temp\opencv" "$env:GITHUB_WORKSPACE\opencv"
        } else {
            Move-Item "$env:GITHUB_WORKSPACE\opencv-temp" "$env:GITHUB_WORKSPACE\opencv"
        }
        
        if (-not (Test-Path "$env:GITHUB_WORKSPACE\opencv\build")) {
            Write-Error "OpenCV build directory not found after extraction"
            exit 1
        }
        
        echo "OpenCV_DIR=$env:GITHUB_WORKSPACE\opencv\build" >> $env:GITHUB_ENV
        echo "$env:GITHUB_WORKSPACE\opencv\build\x64\vc17\bin" >> $env:GITHUB_PATH
      shell: pwsh
    
    - name: Package application
      run: |
        mkdir release-package
        
        # Copy executable from build artifacts
        if (-not (Test-Path "build-artifacts/AutoBrightnessWidget.exe")) {
            Write-Error "Application executable not found in build artifacts"
            exit 1
        }
        Copy-Item build-artifacts/*.exe release-package/
        Copy-Item build-artifacts/*.dll release-package/ -ErrorAction SilentlyContinue
        
        # Deploy Qt dependencies
        $windeployqt = Join-Path $env:Qt6_DIR "bin\windeployqt.exe"
        if (-not (Test-Path $windeployqt)) {
            Write-Error "windeployqt not found at $windeployqt"
            exit 1
        }
        Write-Host "Running windeployqt..."
        Push-Location release-package
        & $windeployqt AutoBrightnessWidget.exe --release --no-compiler-runtime --no-translations
        $deployResult = $LASTEXITCODE
        Pop-Location
        if ($deployResult -ne 0) {
            Write-Error "windeployqt failed with exit code $deployResult"
            exit 1
        }
        
        # Copy OpenCV DLLs
        $opencvX64Path = "$env:GITHUB_WORKSPACE\opencv\build\x64"
        if (-not (Test-Path $opencvX64Path)) {
            Write-Error "OpenCV x64 directory not found at $opencvX64Path"
            exit 1
        }
        
        # Find the VC directory (could be vc16, vc17, etc.)
        $vcDirs = Get-ChildItem -Path $opencvX64Path -Directory | Where-Object { $_.Name -match "^vc\d+$" }
        if ($vcDirs.Count -eq 0) {
            Write-Error "No VC directory found in $opencvX64Path"
            exit 1
        }
        
        $vcDir = $vcDirs[0]
        $opencvBinPath = Join-Path $vcDir.FullName "bin"
        Write-Host "Using OpenCV bin path: $opencvBinPath"
        
        if (-not (Test-Path $opencvBinPath)) {
            Write-Error "OpenCV bin directory not found at $opencvBinPath"
            exit 1
        }
        
        $opencvDlls = Get-ChildItem "$opencvBinPath\opencv_world*.dll"
        if ($opencvDlls.Count -eq 0) {
            Write-Error "No OpenCV DLLs found in $opencvBinPath"
            exit 1
        }
        Write-Host "Copying OpenCV DLLs..."
        $opencvDlls | Copy-Item -Destination release-package/
        
        # Create zip archive
        Write-Host "Creating release archive..."
        Compress-Archive -Path release-package\* -DestinationPath AutoBrightnessWidget-Windows-x64.zip
        
        Write-Host "Package created successfully"
        
        # List package contents for verification
        Write-Host "`nPackage contents:"
        Get-ChildItem release-package | Format-Table Name, Length
      shell: pwsh
    
    - name: Upload package
      uses: actions/upload-artifact@v4
      with:
        name: release-package
        path: AutoBrightnessWidget-Windows-x64.zip
        if-no-files-found: error
        retention-days: 7
  
  test:
    needs: package
    runs-on: windows-2022
    permissions:
      contents: read
      actions: read
      pull-requests: write
    
    steps:
    - name: Download package
      uses: actions/download-artifact@v4.1.3
      with:
        name: release-package
        path: package
    
    - name: Extract and verify package
      run: |
        Write-Host "Extracting package..."
        Expand-Archive -Path package/AutoBrightnessWidget-Windows-x64.zip -DestinationPath test-env
        
        Write-Host "`nPackage contents:"
        Get-ChildItem test-env -Recurse | Format-Table FullName, Length
        
        # Verify main executable exists
        if (-not (Test-Path "test-env/AutoBrightnessWidget.exe")) {
            Write-Error "Main executable not found in package"
            exit 1
        }
        
        # Verify Qt dependencies
        $qtDlls = @("Qt6Core.dll", "Qt6Gui.dll", "Qt6Widgets.dll")
        foreach ($dll in $qtDlls) {
            if (-not (Test-Path "test-env/$dll")) {
                Write-Warning "Qt dependency $dll not found in package"
            } else {
                Write-Host "✓ Found $dll"
            }
        }
        
        # Verify OpenCV DLL
        $opencvDll = Get-ChildItem "test-env/opencv_world*.dll" -ErrorAction SilentlyContinue
        if ($opencvDll) {
            Write-Host "✓ Found OpenCV DLL: $($opencvDll.Name)"
        } else {
            Write-Error "OpenCV DLL not found in package"
            exit 1
        }
        
        Write-Host "`n✓ Package structure verified successfully"
      shell: pwsh
    
    - name: Install Visual C++ Runtime (if needed)
      run: |
        # Install VC++ Redistributable for runtime dependencies
        Write-Host "Installing Visual C++ Redistributable..."
        $vcRedistUrl = "https://aka.ms/vs/17/release/vc_redist.x64.exe"
        $vcRedistInstaller = "vc_redist.x64.exe"
        
        Invoke-WebRequest -Uri $vcRedistUrl -OutFile $vcRedistInstaller -UseBasicParsing
        Start-Process -FilePath $vcRedistInstaller -ArgumentList "/install", "/quiet", "/norestart" -Wait -NoNewWindow
        
        Write-Host "VC++ Runtime installed"
      shell: pwsh
    
    - name: Run application smoke test
      run: |
        Write-Host "Running application smoke test..."
        
        # Test that the application can start and exit
        # Since this is a GUI app, we'll just verify it can be launched
        # For a real test, you would need to use GUI automation tools
        
        $process = Start-Process -FilePath "test-env/AutoBrightnessWidget.exe" -PassThru -NoNewWindow
        
        # Wait a bit for the app to initialize
        Start-Sleep -Seconds 5
        
        # Check if process is running
        if ($process.HasExited) {
            Write-Error "Application exited prematurely with code $($process.ExitCode)"
            exit 1
        }
        
        Write-Host "✓ Application launched successfully"
        
        # Take screenshot of the application window
        Write-Host "Taking screenshot of application window..."
        
        # Create screenshots directory
        New-Item -ItemType Directory -Force -Path screenshots | Out-Null
        
        # Load necessary .NET assemblies for screenshot
        Add-Type -AssemblyName System.Windows.Forms
        Add-Type -AssemblyName System.Drawing
        
        # Wait a moment to ensure window is fully rendered
        Start-Sleep -Seconds 2
        
        # Capture screenshot
        $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
        $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
        $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
        $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
        
        # Save screenshot
        $screenshotPath = "screenshots/app-screenshot.png"
        $bitmap.Save($screenshotPath, [System.Drawing.Imaging.ImageFormat]::Png)
        
        # Cleanup
        $graphics.Dispose()
        $bitmap.Dispose()
        
        Write-Host "✓ Screenshot saved to $screenshotPath"
        
        # Gracefully terminate the process
        $process.Kill()
        $process.WaitForExit(5000)
        
        Write-Host "✓ Smoke test passed - package is valid"
      shell: pwsh
      timeout-minutes: 5
    
    - name: Upload screenshot
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: app-screenshot
        path: screenshots/app-screenshot.png
        if-no-files-found: warn
        retention-days: 7
    
    - name: Upload screenshot to Imgur
      if: github.event_name == 'pull_request'
      id: imgur_step
      continue-on-error: true
      run: |
        $screenshotPath = "screenshots/app-screenshot.png"
        if (-not (Test-Path $screenshotPath)) {
            Write-Host "Screenshot not found"
            echo "IMGUR_SUCCESS=false" >> $env:GITHUB_ENV
            exit 0
        }
        
        $bytes = [System.IO.File]::ReadAllBytes($screenshotPath)
        $base64 = [System.Convert]::ToBase64String($bytes)
        
        $headers = @{ "Authorization" = "Client-ID 546c25a59c58ad7" }
        $body = @{ image = $base64; type = "base64" } | ConvertTo-Json
        
        try {
            $response = Invoke-RestMethod -Uri "https://api.imgur.com/3/image" -Method Post -Headers $headers -Body $body -ContentType "application/json"
            if ($response.success) {
                $url = $response.data.link
                Write-Host "Uploaded to $url"
                echo "IMGUR_URL=$url" >> $env:GITHUB_ENV
                echo "IMGUR_SUCCESS=true" >> $env:GITHUB_ENV
            }
        } catch {
            Write-Host "Upload failed"
            echo "IMGUR_SUCCESS=false" >> $env:GITHUB_ENV
        }
      shell: pwsh
    
    - name: Comment screenshot on PR
      if: github.event_name == 'pull_request'
      env:
        IMGUR_URL: ${{ env.IMGUR_URL }}
        IMGUR_SUCCESS: ${{ env.IMGUR_SUCCESS }}
      uses: actions/github-script@v7
      with:
        script: |
          const workflowRunId = context.runId;
          const workflowUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${workflowRunId}`;
          const imgurSuccess = process.env.IMGUR_SUCCESS === 'true';
          const imgurUrl = process.env.IMGUR_URL;
          
          let comment;
          if (imgurSuccess && imgurUrl) {
            comment = `## 🖼️ Application Screenshot\n\n✅ Application launched successfully!\n\n![Screenshot](${imgurUrl})\n\n**Test Run:** [Workflow #${workflowRunId}](${workflowUrl})\n\n---\n*Screenshot captured during automated testing*`;
          } else {
            comment = `## 🖼️ Application Screenshot\n\n✅ Application launched successfully!\n\n📥 [Download screenshot from workflow run](${workflowUrl})\n\n---\n*Screenshot captured during automated testing*`;
          }
          
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: comment
          });
  
  test-unit:
    needs: build
    runs-on: windows-2022
    permissions:
      contents: read
      actions: read
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Download build artifacts
      uses: actions/download-artifact@v4.1.3
      with:
        name: build-artifacts
        path: build-artifacts
    
    - name: Install Visual C++ Runtime
      run: |
        Write-Host "Installing Visual C++ Redistributable..."
        $vcRedistUrl = "https://aka.ms/vs/17/release/vc_redist.x64.exe"
        $vcRedistInstaller = "vc_redist.x64.exe"
        
        Invoke-WebRequest -Uri $vcRedistUrl -OutFile $vcRedistInstaller -UseBasicParsing
        Start-Process -FilePath $vcRedistInstaller -ArgumentList "/install", "/quiet", "/norestart" -Wait -NoNewWindow
        
        Write-Host "VC++ Runtime installed"
      shell: pwsh
    
    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.5.0'
        arch: 'win64_msvc2019_64'
        cache: true
    
    - name: Install OpenCV
      run: |
        $opencvVersion = "4.10.0"
        $opencvUrl = "https://github.com/opencv/opencv/releases/download/${opencvVersion}/opencv-${opencvVersion}-windows.exe"
        $opencvInstaller = "opencv-installer.exe"
        
        Write-Host "Downloading OpenCV ${opencvVersion}..."
        Invoke-WebRequest -Uri $opencvUrl -OutFile $opencvInstaller -UseBasicParsing
        
        Write-Host "Extracting OpenCV..."
        Start-Process -FilePath $opencvInstaller -ArgumentList "-o$env:GITHUB_WORKSPACE\opencv-temp", "-y" -Wait -NoNewWindow
        
        if (-not (Test-Path "$env:GITHUB_WORKSPACE\opencv-temp")) {
            Write-Error "OpenCV extraction failed"
            exit 1
        }
        
        if (Test-Path "$env:GITHUB_WORKSPACE\opencv-temp\opencv") {
            Move-Item "$env:GITHUB_WORKSPACE\opencv-temp\opencv" "$env:GITHUB_WORKSPACE\opencv"
        } else {
            Move-Item "$env:GITHUB_WORKSPACE\opencv-temp" "$env:GITHUB_WORKSPACE\opencv"
        }
        
        if (-not (Test-Path "$env:GITHUB_WORKSPACE\opencv\build")) {
            Write-Error "OpenCV build directory not found after extraction"
            exit 1
        }
        
        echo "OpenCV_DIR=$env:GITHUB_WORKSPACE\opencv\build" >> $env:GITHUB_ENV
        echo "$env:GITHUB_WORKSPACE\opencv\build\x64\vc17\bin" >> $env:GITHUB_PATH
      shell: pwsh
    
    - name: Run Unit Tests
      run: |
        if (Test-Path "build-artifacts/AutoBrightnessWidgetTests.exe") {
            Write-Host "Running AutoBrightnessWidget Unit Tests..."
            
            # Copy test executable
            Copy-Item build-artifacts/AutoBrightnessWidgetTests.exe .
            
            # Run tests
            .\AutoBrightnessWidgetTests.exe
            if ($LASTEXITCODE -ne 0) {
                Write-Error "Tests failed with exit code $LASTEXITCODE"
                exit 1
            }
            Write-Host "✓ All unit tests passed successfully!"
        } else {
            Write-Warning "Test executable not found. Skipping unit tests."
        }
      shell: pwsh
