name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-2022  # Windows 11
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up MSVC
      uses: microsoft/setup-msbuild@v2
    
    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.5.0'
        arch: 'win64_msvc2019_64'
        modules: 'qtbase qttools'
        cache: true
    
    - name: Install OpenCV
      run: |
        # Download and extract OpenCV
        $opencvVersion = "4.8.1"
        $opencvUrl = "https://github.com/opencv/opencv/releases/download/${opencvVersion}/opencv-${opencvVersion}-windows.exe"
        $opencvInstaller = "opencv-installer.exe"
        
        Write-Host "Downloading OpenCV ${opencvVersion}..."
        Invoke-WebRequest -Uri $opencvUrl -OutFile $opencvInstaller
        
        Write-Host "Extracting OpenCV..."
        Start-Process -FilePath $opencvInstaller -ArgumentList "-o$env:GITHUB_WORKSPACE\opencv", "-y" -Wait
        
        # Set OpenCV path
        echo "OpenCV_DIR=$env:GITHUB_WORKSPACE\opencv\build" >> $env:GITHUB_ENV
        echo "$env:GITHUB_WORKSPACE\opencv\build\x64\vc16\bin" >> $env:GITHUB_PATH
      shell: pwsh
    
    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A x64 -DOpenCV_DIR="$env:OpenCV_DIR"
      shell: pwsh
    
    - name: Build
      run: |
        cd build
        cmake --build . --config Release
      shell: pwsh
    
    - name: Package application
      run: |
        mkdir release-package
        
        # Copy executable
        Copy-Item build/Release/AutoBrightnessWidget.exe release-package/
        
        # Deploy Qt dependencies
        & "$env:IQTA_TOOLS\Qt\6.5.0\msvc2019_64\bin\windeployqt.exe" release-package/AutoBrightnessWidget.exe
        
        # Copy OpenCV DLLs
        Copy-Item "$env:GITHUB_WORKSPACE\opencv\build\x64\vc16\bin\opencv_world*.dll" release-package/ -ErrorAction SilentlyContinue
        
        # Create zip archive
        Compress-Archive -Path release-package\* -DestinationPath AutoBrightnessWidget-Windows-x64.zip
      shell: pwsh
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: AutoBrightnessWidget-Windows-x64.zip
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
