name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-2022  # Windows 11
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up MSVC
      uses: microsoft/setup-msbuild@v2
    
    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.5.0'
        arch: 'win64_msvc2019_64'
        modules: 'qtbase qttools'
        cache: true
    
    - name: Install OpenCV
      run: |
        # Download and extract OpenCV
        $opencvVersion = "4.8.1"
        $opencvUrl = "https://github.com/opencv/opencv/releases/download/${opencvVersion}/opencv-${opencvVersion}-windows.exe"
        $opencvInstaller = "opencv-installer.exe"
        
        Write-Host "Downloading OpenCV ${opencvVersion}..."
        Invoke-WebRequest -Uri $opencvUrl -OutFile $opencvInstaller -UseBasicParsing
        
        Write-Host "Extracting OpenCV..."
        # Use 7zip to extract the self-extracting archive
        Start-Process -FilePath $opencvInstaller -ArgumentList "-o$env:GITHUB_WORKSPACE\opencv-temp", "-y" -Wait -NoNewWindow
        
        # Move extracted content to opencv directory
        if (Test-Path "$env:GITHUB_WORKSPACE\opencv-temp\opencv") {
            Move-Item "$env:GITHUB_WORKSPACE\opencv-temp\opencv" "$env:GITHUB_WORKSPACE\opencv"
        } else {
            Move-Item "$env:GITHUB_WORKSPACE\opencv-temp" "$env:GITHUB_WORKSPACE\opencv"
        }
        
        # Set OpenCV path
        echo "OpenCV_DIR=$env:GITHUB_WORKSPACE\opencv\build" >> $env:GITHUB_ENV
        echo "$env:GITHUB_WORKSPACE\opencv\build\x64\vc16\bin" >> $env:GITHUB_PATH
      shell: pwsh
    
    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A x64 -DOpenCV_DIR="$env:OpenCV_DIR"
      shell: pwsh
    
    - name: Build
      run: |
        cd build
        cmake --build . --config Release
      shell: pwsh
    
    - name: Package application
      run: |
        mkdir release-package
        
        # Copy executable
        Copy-Item build/Release/AutoBrightnessWidget.exe release-package/
        
        # Deploy Qt dependencies (Qt install action sets Qt6_DIR)
        $qtPath = Split-Path (Split-Path $env:Qt6_DIR)
        $windeployqt = Join-Path $qtPath "bin\windeployqt.exe"
        if (Test-Path $windeployqt) {
            & $windeployqt release-package/AutoBrightnessWidget.exe --release --no-compiler-runtime
        } else {
            Write-Host "Warning: windeployqt not found at $windeployqt"
        }
        
        # Copy OpenCV DLLs
        $opencvBinPath = "$env:GITHUB_WORKSPACE\opencv\build\x64\vc16\bin"
        if (Test-Path $opencvBinPath) {
            Get-ChildItem "$opencvBinPath\opencv_world*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination release-package/
        }
        
        # Create zip archive
        Compress-Archive -Path release-package\* -DestinationPath AutoBrightnessWidget-Windows-x64.zip
      shell: pwsh
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: AutoBrightnessWidget-Windows-x64.zip
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
